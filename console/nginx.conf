server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Proxied by the top-level ingress in production; kept here so the
    # console container is also usable standalone in dev.
    location /api/ {
        proxy_pass http://api:8080;
    }
    location /auth/ {
        proxy_pass http://api:8080;
    }
}

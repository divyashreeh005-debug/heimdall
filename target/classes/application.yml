spring:
  application:
    name: heimdall
  profiles:
    active: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heimdall}
    username: ${DB_USER:heimdall}
    password: ${DB_PASSWORD:heimdall}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

heimdall:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-32-bytes-minimum!}
    issuer: heimdall
    ttl-minutes: 60
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:dev-webhook-secret}
    api-base-url: https://api.github.com
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5-coder:14b}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  worker:
    poll-interval-ms: 2000
    worker-id: ${HOSTNAME:local-worker}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
